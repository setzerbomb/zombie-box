<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Zombie Box</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #030712;
    }

    body {
      font-family: system-ui, sans-serif;
    }

    main {
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;

      width: 100vw;
      height: 100vh;

      border: 0;
      background: #030712;
    }
  </style>
</head>

<body>
  <main>
    <canvas
      id="game"
      width="1920"
      height="1080"
    ></canvas>
  </main>

  <script
    type="module"
    src="./main.js"
  ></script>
</body>
</html>
